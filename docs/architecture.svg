<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Precedent architecture</title>
  <desc id="desc">Users talk to agents through Precedent. Every proposed tool or MCP call passes a deterministic policy gate before it runs. Decisions, policy, agent memory and demand live in MongoDB Atlas; Voyage AI ranks memory; A Groq-hosted model plans and judges; Raindrop traces every run and gives an independent second check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B7E"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#F8F7F3"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0F1729">Precedent: the model proposes, policy decides, MongoDB remembers</text>
  <text x="40" y="80" font-size="15" fill="#475569">Every agent action passes the gate; every lesson is checked, approved by a human, stored in Atlas and reused by the next agent.</text>

  <!-- Users -->
  <rect x="30" y="120" width="220" height="190" rx="14" fill="#FFFFFF" stroke="#D9D6CC"/>
  <text x="46" y="152" font-size="17" font-weight="700" fill="#0F1729">People</text>
  <text x="46" y="180" font-size="13" fill="#334155">Engineers, sales, finance</text>
  <text x="46" y="202" font-size="13" fill="#334155">ask agents for data and tools</text>
  <text x="46" y="236" font-size="13" fill="#334155">InfoSec / admins</text>
  <text x="46" y="258" font-size="13" fill="#334155">approve, publish rules,</text>
  <text x="46" y="280" font-size="13" fill="#334155">quarantine connectors</text>

  <!-- Web app -->
  <rect x="30" y="340" width="220" height="150" rx="14" fill="#FFFFFF" stroke="#D9D6CC"/>
  <text x="46" y="372" font-size="17" font-weight="700" fill="#0F1729">Web app</text>
  <text x="46" y="398" font-size="13" fill="#334155">Side-by-side chats</text>
  <text x="46" y="420" font-size="13" fill="#334155">(without vs with Precedent)</text>
  <text x="46" y="444" font-size="13" fill="#334155">Admin console</text>
  <text x="46" y="466" font-size="13" fill="#334155">Mission Control</text>
  <line x1="140" y1="310" x2="140" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Precedent gate -->
  <rect x="280" y="120" width="460" height="370" rx="16" fill="#0F1729"/>
  <text x="314" y="154" font-size="19" font-weight="700" fill="#5EEAD4">Precedent API (Modelence)</text>
  <text x="314" y="178" font-size="12" fill="#CBD5E1">Deterministic gate in front of every tool and MCP call</text>
  <rect x="300" y="194" width="420" height="62" rx="10" fill="#1E293B"/>
  <text x="330" y="219" font-size="15" font-weight="700" fill="#F8FAFC">Policy engine</text>
  <text x="330" y="241" font-size="12" fill="#CBD5E1">MCP-01/03/04 · DATA-18/30/31 · INCIDENT-01 · approvals</text>
  <rect x="300" y="266" width="420" height="62" rx="10" fill="#1E293B"/>
  <text x="330" y="291" font-size="15" font-weight="700" fill="#F8FAFC">MCP gateway + search judge</text>
  <text x="330" y="313" font-size="12" fill="#CBD5E1">Groq gpt-oss-120b labels; policy blocks web-search MCPs</text>
  <rect x="300" y="338" width="420" height="62" rx="10" fill="#1E293B"/>
  <text x="330" y="363" font-size="15" font-weight="700" fill="#F8FAFC">Learning loop</text>
  <text x="330" y="385" font-size="12" fill="#CBD5E1">Checkpoint → human approval → department memory</text>
  <rect x="300" y="410" width="420" height="62" rx="10" fill="#1E293B"/>
  <text x="330" y="435" font-size="15" font-weight="700" fill="#F8FAFC">Self-writing guardrails · kill switch</text>
  <text x="330" y="457" font-size="12" fill="#CBD5E1">Impact replay · Raindrop check · one-click quarantine</text>
  <line x1="250" y1="415" x2="278" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent worker -->
  <rect x="280" y="530" width="460" height="96" rx="14" fill="#FFFFFF" stroke="#D9D6CC"/>
  <text x="314" y="562" font-size="17" font-weight="700" fill="#0F1729">Agent worker (eve)</text>
  <text x="314" y="586" font-size="13" fill="#334155">Groq gpt-oss-120b plans and chats.</text>
  <text x="314" y="608" font-size="13" fill="#334155">Receives policy + memory as context; can only propose steps.</text>
  <line x1="470" y1="528" x2="470" y2="492" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="492" x2="530" y2="528" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="516" font-size="12" fill="#475569">proposed plan</text>
  <text x="538" y="516" font-size="12" fill="#475569">context</text>

  <!-- Tools -->
  <rect x="30" y="530" width="220" height="146" rx="14" fill="#FFFFFF" stroke="#D9D6CC"/>
  <text x="46" y="562" font-size="16" font-weight="700" fill="#0F1729">Tools and MCPs</text>
  <text x="46" y="586" font-size="13" fill="#334155">Only what policy allows:</text>
  <text x="46" y="610" font-size="13" fill="#334155">warehouse, internal logs,</text>
  <text x="46" y="632" font-size="13" fill="#334155">LogLens connector,</text>
  <text x="46" y="654" font-size="13" fill="#334155">DeepWiki, Docs Preview…</text>
  <path d="M280,470 C262,470 262,520 250,560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168" y="512" font-size="12" fill="#475569">allowed calls only</text>

  <!-- MongoDB -->
  <rect x="790" y="120" width="390" height="250" rx="16" fill="#E8F5EF" stroke="#13AA52" stroke-width="2"/>
  <text x="806" y="154" font-size="19" font-weight="700" fill="#0B6E35">MongoDB Atlas</text>
  <text x="806" y="180" font-size="13" fill="#14532D">Transactional decisions, policy versions, receipts</text>
  <text x="806" y="204" font-size="13" fill="#14532D">Agent memory (department-scoped pointers)</text>
  <text x="806" y="228" font-size="13" fill="#14532D">MCP demand counts (distinct requesters)</text>
  <text x="806" y="252" font-size="13" fill="#14532D">Playbooks + Atlas Vector Search</text>
  <text x="806" y="276" font-size="13" fill="#14532D">Change Streams: policy changes reach agents live</text>
  <text x="806" y="300" font-size="13" fill="#14532D">Synthetic warehouse rows</text>
  <text x="806" y="340" font-size="13" font-weight="700" fill="#0B6E35">Recursive learning: lessons written here are read</text>
  <text x="806" y="358" font-size="13" font-weight="700" fill="#0B6E35">back before the next agent plans.</text>
  <path d="M740,370 C765,370 765,250 788,250" fill="none" stroke="#0F8B7E" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M788,330 C765,330 765,560 742,560" fill="none" stroke="#0F8B7E" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowTeal)"/>
  <text x="744" y="300" font-size="12" fill="#0F8B7E">write</text>
  <text x="744" y="520" font-size="12" fill="#0F8B7E">read</text>

  <!-- Voyage -->
  <rect x="790" y="400" width="390" height="96" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="806" y="432" font-size="19" font-weight="700" fill="#3730A3">Voyage AI</text>
  <text x="806" y="458" font-size="13" fill="#312E81">Embeddings + rerank: finds the right memory,</text>
  <text x="806" y="480" font-size="13" fill="#312E81">policy and playbook for each new request</text>

  <!-- Raindrop -->
  <rect x="790" y="526" width="390" height="140" rx="16" fill="#FFF4EC" stroke="#EA7A2E" stroke-width="2"/>
  <text x="806" y="558" font-size="19" font-weight="700" fill="#9A3412">Raindrop</text>
  <text x="806" y="584" font-size="13" fill="#7C2D12">Traces every run and policy decision</text>
  <text x="806" y="608" font-size="13" fill="#7C2D12">Second check before a self-written rule ships</text>
  <text x="806" y="632" font-size="13" fill="#7C2D12">MCP-04 evidence for InfoSec; approve/deny</text>
  <text x="806" y="652" font-size="13" fill="#7C2D12">fed back as signals</text>
  <line x1="742" y1="610" x2="788" y2="610" stroke="#EA7A2E" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
